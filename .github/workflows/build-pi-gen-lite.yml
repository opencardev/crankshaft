name: build-pi-gen-lite

on:
  workflow_call:
    inputs:
      version:
        description: "Version"
        required: true
        type: string
      release:
        description: "Debian Release"
        type: string
        required: false
        default: "trixie"
      auto_release:
        description: "Auto release"
        required: false
        default: "false"
        type: string
      create_release_draft:
        description: "Create release draft"
        required: false
        default: "false"
        type: string
      release-tag:
        description: "Git release tag to build for (e.g., v1.2.0)"
        required: false
        type: string
      attach-to-release:
        description: "Automatically attach images to GitHub release"
        required: false
        default: "false"
        type: string
      enable_nightly:
        description: "Also enable the nightly apt component (stable is always enabled)"
        required: false
        default: "false"
        type: string

  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        required: true
        default: "DEV"
        type: string
      release:
        description: "Debian Release"
        required: false
        default: "trixie"
        type: choice
        options:
          - trixie
      auto_release:
        description: "Automatically create a GitHub release from this build"
        required: false
        default: false
        type: boolean
      create_release_draft:
        description: "Create the release as a draft"
        required: false
        default: false
        type: boolean
      release-tag:
        description: "Git release tag to build for (e.g., v1.2.0) - optional"
        required: false
        default: ""
        type: string
      attach-to-release:
        description: "Automatically attach images to GitHub release"
        required: false
        default: false
        type: boolean
      enable_nightly:
        description: "Also enable the nightly apt component (stable is always enabled)"
        required: false
        default: false
        type: boolean

env:
  DEBIAN_FRONTEND: noninteractive

permissions:
  contents: write

jobs:
  build-lite-images:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: armhf
            branch: master
            platform: linux/arm/v7
          - arch: arm64
            branch: arm64
            platform: linux/arm64

    outputs:
      version: ${{ steps.get_version.outputs.version }}
      builddate: ${{ steps.get_version.outputs.builddate }}

    steps:
      - name: Checkout crankshaft repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get build metadata
        id: get_version
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version || github.event.inputs.version || 'DEV' }}"
          ARCH="${{ matrix.arch }}"
          RELEASE="${{ inputs.release || github.event.inputs.release || 'trixie' }}"
          BUILD_HASH=$(git rev-parse --short "$GITHUB_SHA")
          BUILD_DATE=$(date '+%Y-%m-%d')
          BUILD_BRANCH="pi-gen-lite"

          if [ "$VERSION" = "DEV" ]; then
            VERSION_STRING="${BUILD_DATE}-${BUILD_BRANCH}-${ARCH}-${RELEASE}-${BUILD_HASH}"
          else
            VERSION_STRING="${VERSION}-${BUILD_DATE}-${ARCH}-${RELEASE}-${BUILD_HASH}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_string=${VERSION_STRING}" >> "$GITHUB_OUTPUT"
          echo "buildhash=${BUILD_HASH}" >> "$GITHUB_OUTPUT"
          echo "buildbranch=${BUILD_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "builddate=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "arch=${ARCH}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Checkout pi-gen repository
        uses: actions/checkout@v7
        with:
          repository: RPi-Distro/pi-gen
          ref: ${{ matrix.branch }}
          path: pi-gen
          fetch-depth: 1

      - name: Prepare pi-gen custom stage
        run: |
          set -euo pipefail
          rm -rf pi-gen/stage60
          cp -r image_builder/stages/stage60 pi-gen/stage60
          find pi-gen/stage60 -type f -name "*.sh" -exec chmod +x {} \;
          sed -i 's/qemu-user-binfmt/qemu-user-static/g' pi-gen/depends

      - name: Install host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            coreutils quilt parted qemu-user-static debootstrap zerofree zip \
            dosfstools e2fsprogs libarchive-tools libcap2-bin grep rsync xz-utils \
            file git curl bc gpg pigz xxd arch-test bmap-tools kmod binfmt-support

      - name: Enable binfmt emulation
        run: |
          set -euo pipefail
          sudo modprobe binfmt_misc
          sudo ln -sf /usr/bin/qemu-arm-static /usr/local/bin/qemu-arm
          sudo ln -sf /usr/bin/qemu-aarch64-static /usr/local/bin/qemu-aarch64
          sudo update-binfmts --enable qemu-arm
          sudo update-binfmts --enable qemu-aarch64
          arch-test "${{ matrix.arch }}"

      - name: Configure pi-gen build
        run: |
          set -euo pipefail
          TEMPLATE="${GITHUB_WORKSPACE}/image_builder/pi-gen-stages/config-template"
          ENABLE_NIGHTLY="${{ inputs.enable_nightly || 'false' }}"
          sed \
            -e 's|@@IMG_NAME@@|${{ steps.get_version.outputs.version_string }}|g' \
            -e 's|@@RELEASE@@|${{ steps.get_version.outputs.release }}|g' \
            -e 's|@@CRANKSHAFT_APT_SUITE@@|${{ steps.get_version.outputs.release }}|g' \
            -e "s|@@CRANKSHAFT_ENABLE_NIGHTLY@@|${ENABLE_NIGHTLY}|g" \
            "${TEMPLATE}" > pi-gen/config
          echo "--- Generated pi-gen config ---"
          cat pi-gen/config

      - name: Build pi-gen lite image
        working-directory: pi-gen
        run: |
          set -euo pipefail
          sudo ./build.sh
          sudo chown -R "$(id -u):$(id -g)" deploy work || true

      - name: Collect build outputs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p pi-gen/extracted-container

          if [ -d pi-gen/deploy ]; then
            cp -r pi-gen/deploy pi-gen/extracted-container/
          fi
          if [ -f pi-gen/work/build.log ]; then
            cp pi-gen/work/build.log pi-gen/extracted-container/build.log
          fi

          if [ ! -d pi-gen/extracted-container/deploy ]; then
            echo "No deploy directory found in container or host"
          fi

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: pi-gen-lite-${{ matrix.arch }}-${{ steps.get_version.outputs.builddate }}-${{ steps.get_version.outputs.version }}
          path: |
            pi-gen/extracted-container/deploy/
            pi-gen/extracted-container/build.log
            pi-gen/extracted-container/docker-container.log
          retention-days: 30

      - name: Upload build diagnostics on failure
        if: always() && (failure() || cancelled())
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-failure-${{ matrix.arch }}-${{ steps.get_version.outputs.builddate }}-${{ steps.get_version.outputs.version }}
          path: |
            pi-gen/extracted-container/
            pi-gen/deploy/
            pi-gen/*.log
          retention-days: 7

  build-summary:
    name: Build Summary
    needs: [build-lite-images]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build Success Summary
        if: needs.build-lite-images.result == 'success'
        run: |
          echo "Pi-gen lite image builds completed successfully"
          echo "Version: ${{ needs.build-lite-images.outputs.version }}"
          echo "Date: ${{ needs.build-lite-images.outputs.builddate }}"

      - name: Build Failure Summary
        if: needs.build-lite-images.result == 'failure'
        run: |
          echo "Pi-gen lite image build failed"
          exit 1

  create-release:
    name: Create GitHub Release
    needs: [build-lite-images]
    if: >-
      needs.build-lite-images.result == 'success' &&
      (inputs.auto_release == 'true' || inputs.auto_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all image artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: pi-gen-lite-*
          path: release-assets
          merge-multiple: false

      - name: Collect image files
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t image_files < <(find release-assets -type f \( -name "*.img.xz" -o -name "*.img.gz" -o -name "*.zip" \) | sort)
          echo "Found ${#image_files[@]} image file(s):"
          for f in "${image_files[@]}"; do echo "  $f"; done
          printf '%s\n' "${image_files[@]}" > image-files.txt

      - name: Generate release notes
        id: notes
        shell: bash
        env:
          VERSION: ${{ needs.build-lite-images.outputs.version }}
          BUILD_DATE: ${{ needs.build-lite-images.outputs.builddate }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -n1 || true)

          {
            echo "## Crankshaft ${TAG}"
            echo
            echo "**Released:** ${BUILD_DATE}  "
            echo "**Architectures:** \`armhf\` (ARMv7 32-bit), \`arm64\` (AArch64 64-bit)"
            echo
            echo "### Changes"
            echo
            if [[ -n "${PREV_TAG}" ]]; then
              git log "${PREV_TAG}..HEAD" \
                --pretty=format:"- %s (%h)" \
                --no-merges \
                | head -60
            else
              git log HEAD \
                --pretty=format:"- %s (%h)" \
                --no-merges \
                | head -60
            fi
            echo
            echo
            echo "### Installation"
            echo
            echo "Flash the correct image for your Raspberry Pi to an SD card using [Raspberry Pi Imager](https://www.raspberrypi.com/software/) or \`dd\`."
            echo
            echo "| Image suffix | Compatible hardware |"
            echo "|---|---|"
            echo "| \`armhf\` | Raspberry Pi 2 / 3 / 4 / 5 (32-bit OS) |"
            echo "| \`arm64\` | Raspberry Pi 3 / 4 / 5 (64-bit OS) |"
            echo
            if [[ -n "${PREV_TAG}" ]]; then
              echo "**Full changelog:** https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
            fi
          } > release-notes.md

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CREATE_DRAFT: ${{ inputs.create_release_draft }}
          ATTACH_IMAGES: ${{ inputs.attach-to-release }}
        run: |
          set -euo pipefail
          TAG="${{ steps.notes.outputs.tag }}"

          EXTRA_FLAGS=()
          if [[ "${CREATE_DRAFT}" == "true" ]]; then
            EXTRA_FLAGS+=(--draft)
          fi

          ASSET_ARGS=()
          if [[ "${ATTACH_IMAGES}" == "true" ]] && [[ -s image-files.txt ]]; then
            while IFS= read -r f; do
              [[ -n "$f" ]] && ASSET_ARGS+=("$f")
            done < image-files.txt
          fi

          gh release create "${TAG}" \
            --title "Crankshaft ${TAG}" \
            --notes-file release-notes.md \
            "${EXTRA_FLAGS[@]}" \
            "${ASSET_ARGS[@]}"
