# Crankshaft Raspberry Pi OS optimization profile

# Prefer keeping application working sets in memory under pressure.
vm.swappiness = 10
vm.vfs_cache_pressure = 50

# Reduce dirty page burst size to avoid long writeback stalls on SD media.
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15

# Increase socket queue depth for bursty IPC/network workloads.
net.core.somaxconn = 1024
